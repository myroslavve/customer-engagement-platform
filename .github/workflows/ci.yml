name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  integration:
    name: Migrations and worker smoke test
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cep
          POSTGRES_PASSWORD: cep
          POSTGRES_DB: cep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cep -d cep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://cep:cep@localhost:5432/cep
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations apply, revert and re-apply cleanly
        run: |
          npm run migration:run
          npm run migration:revert
          npm run migration:run
      - run: npm run build
      - name: Application boots and consumes the events queue
        run: |
          node dist/main.js > worker.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            grep -q 'Consuming "events"' worker.log && break
            sleep 1
          done
          kill -INT "$pid" || true
          cat worker.log
          grep -q 'Consuming "events"' worker.log
