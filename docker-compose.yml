services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cep
      POSTGRES_PASSWORD: cep
      POSTGRES_DB: cep
    ports:
      - '127.0.0.1:5440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cep -d cep']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6390:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
